<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма</title>
</head>
<body>
<main>
    <h1>Додати викладача</h1>
    <form>
        <p>
            <label for="pib">Повне ім’я:</label>
            <input type="text" id="pib" name="pib">
        </p>
        <p>
            Стать:
            <input type="radio" id="m" name="s" value="m"><label for="m">Чол.</label>
            <input type="radio" id="f" name="s" value="f"><label for="f">Жін.</label>
        </p>
        <p>
            <label for="date">Дата народження:</label>
            <input type="date" id="date" name="date">
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </p>
        <p>
            <label for="tel">Телефон:</label>
            <input type="tel" id="tel" name="tel">
        </p>
        <p>
            <label for="color">Колір фону:</label>
            <input type="color" id="color" name="color">
        </p>
        <p>
            <label for="country">Країна:</label>
            <select id="country">
                <option>Україна</option>
                <option>Інша</option>
            </select>
        </p>
        <p>
            <label for="city">Місто:</label>
            <input type="text" id="city">
        </p>
        <p>
            <label for="txt">Коментар:</label><br>
            <textarea id="txt" name="txt"></textarea>
        </p>
        <button type="submit">Надіслати</button>
    </form>
</main>
</body>
</html>
